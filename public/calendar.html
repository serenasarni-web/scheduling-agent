<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario - Scheduling Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
      color: #fff;
      padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 30px; color: #667eea; }
    
    .calendar-controls {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    button {
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,0.3); }
    button.active { background: #667eea; }
    
    input[type="date"] {
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #fff;
    }
    
    .calendar {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }
    
    .month-view {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }
    
    .day {
      aspect-ratio: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.3s;
      overflow-y: auto;
      max-height: 120px;
    }
    
    .day:hover { background: rgba(102,126,234,0.1); border-color: #667eea; }
    .day.other-month { opacity: 0.3; }
    .day.today { border: 2px solid #667eea; }
    
    .day-number { font-weight: 600; font-size: 12px; margin-bottom: 5px; }
    
    .appointment-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #667eea;
      margin: 2px 0;
    }
    
    .week-view {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }
    
    .week-day {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 15px;
      min-height: 300px;
    }
    
    .week-day-header { font-weight: 600; margin-bottom: 10px; font-size: 14px; }
    
    .appointment-item {
      background: rgba(102,126,234,0.2);
      border-left: 3px solid #667eea;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    
    .day-view {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 20px;
    }
    
    .day-view h2 { margin-bottom: 20px; }
    
    .time-slot {
      display: flex;
      margin-bottom: 15px;
      gap: 15px;
    }
    
    .time { width: 60px; font-weight: 600; color: #667eea; }
    .slot-content { flex: 1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📅 Calendario</h1>
    
    <div class="calendar-controls">
      <button onclick="switchView('month')" class="active">Mese</button>
      <button onclick="switchView('week')">Settimana</button>
      <button onclick="switchView('day')">Giorno</button>
      <input type="date" id="dateInput" onchange="changeDate()">
      <button onclick="today()">Oggi</button>
    </div>
    
    <div class="calendar" id="calendar"></div>
  </div>
  
  <script>
    let currentDate = new Date();
    let currentView = 'month';
    let appointments = [];
    
    async function loadAppointments() {
      try {
        const res = await fetch('/api/appointments');
        appointments = await res.json();
        render();
      } catch (error) {
        console.error('Errore caricamento appuntamenti:', error);
      }
    }
    
    function switchView(view) {
      currentView = view;
      document.querySelectorAll('.calendar-controls button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }
    
    function changeDate() {
      const dateInput = document.getElementById('dateInput').value;
      if (dateInput) {
        currentDate = new Date(dateInput + 'T00:00:00');
        render();
      }
    }
    
    function today() {
      currentDate = new Date();
      document.getElementById('dateInput').valueAsDate = currentDate;
      render();
    }
    
    function render() {
      const calendar = document.getElementById('calendar');
      if (currentView === 'month') {
        calendar.innerHTML = renderMonth();
      } else if (currentView === 'week') {
        calendar.innerHTML = renderWeek();
      } else {
        calendar.innerHTML = renderDay();
      }
    }
    
    function renderMonth() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startingDayOfWeek = firstDay.getDay();
      
      let html = `<div style="margin-bottom: 15px; text-align: center; font-size: 18px; font-weight: 600;">${firstDay.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' })}</div>`;
      html += '<div class="month-view">';
      
      const dayNames = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
      dayNames.forEach(day => {
        html += `<div style="text-align: center; font-weight: 600; padding: 10px;">${day}</div>`;
      });
      
      for (let i = 0; i < startingDayOfWeek; i++) {
        html += '<div class="day other-month"></div>';
      }
      
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const isToday = date.toDateString() === new Date().toDateString();
        const dayAppointments = appointments.filter(apt => new Date(apt.start_time).toDateString() === date.toDateString());
        
        html += `<div class="day ${isToday ? 'today' : ''}">
          <div class="day-number">${day}</div>
          ${dayAppointments.map(() => '<div class="appointment-dot"></div>').join('')}
        </div>`;
      }
      
      html += '</div>';
      return html;
    }
    
    function renderWeek() {
      const startOfWeek = new Date(currentDate);
      startOfWeek.setDate(currentDate.getDate() - currentDate.getDay());
      
      let html = `<div style="margin-bottom: 15px; text-align: center; font-size: 18px; font-weight: 600;">Settimana del ${startOfWeek.toLocaleDateString('it-IT')}</div>`;
      html += '<div class="week-view">';
      
      for (let i = 0; i < 7; i++) {
        const date = new Date(startOfWeek);
        date.setDate(startOfWeek.getDate() + i);
        const dayAppointments = appointments.filter(apt => new Date(apt.start_time).toDateString() === date.toDateString());
        
        html += `<div class="week-day">
          <div class="week-day-header">${date.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric' })}</div>
          ${dayAppointments.map(apt => `<div class="appointment-item">${apt.title}<br>${new Date(apt.start_time).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}</div>`).join('')}
        </div>`;
      }
      
      html += '</div>';
      return html;
    }
    
    function renderDay() {
      const dayAppointments = appointments.filter(apt => new Date(apt.start_time).toDateString() === currentDate.toDateString());
      
      let html = `<div class="day-view">
        <h2>${currentDate.toLocaleDateString('it-IT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</h2>`;
      
      if (dayAppointments.length === 0) {
        html += '<p style="color: rgba(255,255,255,0.5);">Nessun appuntamento oggi</p>';
      } else {
        dayAppointments.forEach(apt => {
          const time = new Date(apt.start_time).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
          html += `<div class="time-slot">
            <div class="time">${time}</div>
            <div class="slot-content">
              <div style="font-weight: 600;">${apt.title}</div>
              <div style="font-size: 12px; color: rgba(255,255,255,0.7);">${apt.duration_minutes} minuti</div>
            </div>
          </div>`;
        });
      }
      
      html += '</div>';
      return html;
    }
    
    // Init
    loadAppointments();
    document.getElementById('dateInput').valueAsDate = currentDate;
  </script>
</body>
</html>
