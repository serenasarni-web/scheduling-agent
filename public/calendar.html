<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario - Scheduling Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%); color: #fff; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { color: #667eea; margin-bottom: 20px; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    button { padding: 8px 16px; background: #667eea; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #764ba2; }
    button.active { background: #764ba2; }
    input[type="date"] { padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid #667eea; border-radius: 6px; color: #fff; }
    .calendar { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; }
    .month-header { text-align: center; font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #667eea; }
    .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
    .day-header { text-align: center; font-weight: 600; padding: 10px; border-bottom: 1px solid #667eea; }
    .day { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; overflow-y: auto; }
    .day:hover { background: rgba(102,126,234,0.2); border-color: #667eea; }
    .day.other-month { opacity: 0.3; }
    .day.today { border: 2px solid #667eea; background: rgba(102,126,234,0.1); }
    .day-number { font-weight: 600; font-size: 12px; margin-bottom: 4px; }
    .apt-mini { background: rgba(102,126,234,0.2); border-left: 2px solid #667eea; padding: 4px; margin-bottom: 4px; border-radius: 3px; font-size: 11px; }
    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
    .week-day { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px; min-height: 200px; cursor: pointer; }
    .week-day:hover { background: rgba(102,126,234,0.2); border-color: #667eea; }
    .week-day-header { font-weight: 600; margin-bottom: 8px; font-size: 12px; color: #667eea; }
    .day-view { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 20px; }
    .day-view h2 { margin-bottom: 20px; color: #667eea; }
    .time-slot { display: flex; gap: 15px; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .time { width: 80px; font-weight: 600; color: #667eea; }
    .apt-details { flex: 1; }
    .apt-details h3 { color: #fff; margin-bottom: 5px; }
    .apt-details p { font-size: 12px; color: rgba(255,255,255,0.7); }
  </style>
</head>
<body>
  <div class="container">
    <h1>📅 Calendario</h1>
    <div class="controls">
      <button onclick="setView('month')" id="btn-month" class="active">Mese</button>
      <button onclick="setView('week')" id="btn-week">Settimana</button>
      <button onclick="setView('day')" id="btn-day">Giorno</button>
      <input type="date" id="dateInput" onchange="updateFromInput()">
      <button onclick="today()">Oggi</button>
    </div>
    <div class="calendar" id="calendar"></div>
  </div>

  <script>
    const categoryIcons = {
      work_consulenza_spot: '💼', work_consulenza: '💼', work_allineamento: '💼', work_primo_app: '💼',
      work_docenza: '💼', work_amministrazione: '💼', work_message_mail: '💼', work_meeting: '💼',
      gestione_pagamenti: '💳', famiglia_gestione: '👨‍👩‍👧‍👦', famiglia_appuntamento: '👨‍👩‍👧‍👦',
      salute_psicologo: '🧠', salute_altro: '🧠', svago: '🎉', varie: '⚙️'
    };

    let currentDate = new Date();
    let currentView = 'month';
    let appointments = [];

    function getDateKey(date) {
      return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
    }

    function sameDay(d1, d2) {
      return getDateKey(d1) === getDateKey(d2);
    }

    async function loadAppointments() {
      try {
        const res = await fetch('/api/appointments');
        appointments = await res.json();
        console.log(`📅 Caricati ${appointments.length} appuntamenti`);
        updateCalendar();
      } catch (error) {
        console.error('Errore caricamento:', error);
      }
    }

    function setView(view) {
      currentView = view;
      document.querySelectorAll('#btn-month, #btn-week, #btn-day').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + view).classList.add('active');
      updateCalendar();
    }

    function updateFromInput() {
      const val = document.getElementById('dateInput').value;
      if (val) {
        const [y, m, d] = val.split('-');
        currentDate = new Date(parseInt(y), parseInt(m) - 1, parseInt(d));
        setView('day');
      }
    }

    function updateCalendar() {
      document.getElementById('dateInput').value = getDateKey(currentDate);
      if (currentView === 'month') renderMonth();
      else if (currentView === 'week') renderWeek();
      else renderDay();
    }

    function today() {
      currentDate = new Date();
      updateCalendar();
    }

    function selectDay(dateStr) {
      const [year, month, day] = dateStr.split('-');
      currentDate = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
      setView('day');
    }

    function renderMonth() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startingDayOfWeek = firstDay.getDay();

      let html = `<div class="month-header">${firstDay.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' })}</div>`;
      html += '<div class="month-grid">';

      ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'].forEach(day => {
        html += `<div class="day-header">${day}</div>`;
      });

      for (let i = 0; i < startingDayOfWeek; i++) {
        html += '<div class="day other-month"></div>';
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        const dateStr = getDateKey(date);
        const isToday = sameDay(date, new Date());
        const dayAppointments = appointments.filter(apt => sameDay(new Date(apt.start_time), date));

        html += `<div class="day ${isToday ? 'today' : ''}" onclick="selectDay('${dateStr}')">
          <div class="day-number">${day}</div>
          ${dayAppointments.map(apt => `<div class="apt-mini">${categoryIcons[apt.category] || '📅'} ${apt.title}</div>`).join('')}
        </div>`;
      }

      html += '</div>';
      document.getElementById('calendar').innerHTML = html;
    }

    function renderWeek() {
      const startOfWeek = new Date(currentDate);
      startOfWeek.setDate(currentDate.getDate() - currentDate.getDay());

      let html = `<div class="month-header">Settimana del ${startOfWeek.toLocaleDateString('it-IT')}</div>`;
      html += '<div class="week-grid">';

      for (let i = 0; i < 7; i++) {
        const date = new Date(startOfWeek);
        date.setDate(startOfWeek.getDate() + i);
        const dateStr = getDateKey(date);
        const dayAppointments = appointments.filter(apt => sameDay(new Date(apt.start_time), date));

        html += `<div class="week-day" onclick="selectDay('${dateStr}')">
          <div class="week-day-header">${date.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric' })}</div>
          ${dayAppointments.map(apt => `<div class="apt-mini">${categoryIcons[apt.category] || '📅'} ${apt.title}<br>${new Date(apt.start_time).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}</div>`).join('')}
        </div>`;
      }

      html += '</div>';
      document.getElementById('calendar').innerHTML = html;
    }

    function renderDay() {
      const dateStr = getDateKey(currentDate);
      const dayAppointments = appointments.filter(apt => sameDay(new Date(apt.start_time), currentDate)).sort((a, b) => new Date(a.start_time) - new Date(b.start_time));

      let html = `<div class="day-view">
        <h2>${currentDate.toLocaleDateString('it-IT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</h2>`;

      if (dayAppointments.length === 0) {
        html += '<p style="color: rgba(255,255,255,0.5);">Nessun appuntamento</p>';
      } else {
        dayAppointments.forEach(apt => {
          const time = new Date(apt.start_time).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
          html += `<div class="time-slot">
            <div class="time">${time}</div>
            <div class="apt-details">
              <h3>${categoryIcons[apt.category] || '📅'} ${apt.title}</h3>
              <p>⏱️ ${apt.duration_minutes} minuti</p>
              <p>${apt.google_event_id ? '✅ Da Google' : '✏️ Creato localmente'}</p>
            </div>
          </div>`;
        });
      }

      html += '</div>';
      document.getElementById('calendar').innerHTML = html;
    }

    loadAppointments();
  </script>
</body>
</html>
