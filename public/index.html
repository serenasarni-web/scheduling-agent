<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduling Agent - Barny</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%); color: #fff; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(102,126,234,0.3); }
    h1 { color: #667eea; font-size: 28px; }
    nav { display: flex; gap: 10px; flex-wrap: wrap; }
    nav button { padding: 8px 16px; background: rgba(102,126,234,0.2); color: #667eea; border: 1px solid #667eea; border-radius: 6px; cursor: pointer; font-size: 14px; }
    nav button:hover { background: #667eea; color: #fff; }
    nav button.active { background: #667eea; color: #fff; }
    .content { display: none; }
    .content.active { display: block; }
    .section { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    h2 { color: #667eea; margin-bottom: 15px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input, textarea, select { width: 100%; padding: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #fff; font-family: inherit; }
    button { padding: 10px 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .list { display: grid; gap: 15px; }
    .item { background: rgba(255,255,255,0.05); border-left: 3px solid #667eea; padding: 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
    .item-content { flex: 1; }
    .item h3 { color: #667eea; margin-bottom: 5px; }
    .item p { font-size: 14px; color: rgba(255,255,255,0.7); margin: 5px 0; }
    .category-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; background: rgba(102,126,234,0.3); }
    .item-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .item-actions button { padding: 6px 12px; font-size: 12px; background: rgba(102,126,234,0.3); margin: 0; }
    .item-actions button.delete { background: rgba(255,107,107,0.3); color: #ff6b6b; border: 1px solid #ff6b6b; }
    .item-actions button.edit { background: rgba(102,126,234,0.3); color: #667eea; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal-content { background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%); border: 1px solid rgba(102,126,234,0.3); border-radius: 12px; padding: 30px; max-width: 500px; width: 90%; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h2 { margin: 0; }
    .modal-close { font-size: 28px; cursor: pointer; color: #667eea; background: none; border: none; padding: 0; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📅 Scheduling Agent</h1>
      <nav>
        <button onclick="showTab('dashboard')" class="active">Dashboard</button>
        <button onclick="showTab('appointments')">📅 Appuntamenti</button>
        <button onclick="showTab('activities')">⚙️ Attività</button>
        <button onclick="showTab('clients')">Clienti</button>
        <button onclick="showTab('invoices')">💳 Fatture</button>
        <button onclick="showTab('calendar')">🗓️ Calendario</button>
      </nav>
    </header>

    <div id="dashboard" class="content active">
      <div class="section">
        <h2>📥 Google Calendar</h2>
        <button onclick="readFromGoogle()">Leggi da Google</button>
      </div>
      <div class="section">
        <h2>📋 Prossimi Appuntamenti</h2>
        <div id="dashboard-appointments" class="list"></div>
      </div>
    </div>

    <div id="appointments" class="content">
      <div class="section">
        <h2>➕ Nuovo Appuntamento</h2>
        <form onsubmit="createAppointment(event)">
          <div class="form-group"><label>Titolo</label><input type="text" id="apt-title" required></div>
          <div class="form-group"><label>Cliente</label><select id="apt-client" required></select></div>
          <div class="form-group"><label>Categoria</label><select id="apt-category" required onchange="updateDuration()">
            <optgroup label="WORK 💼">
              <option value="work_consulenza_spot">💼 Consulenza Spot (50 min)</option>
              <option value="work_consulenza">💼 Consulenza (60 min)</option>
              <option value="work_allineamento">💼 Allineamento (30 min)</option>
              <option value="work_primo_app">💼 1° Appuntamento (60 min)</option>
              <option value="work_docenza">💼 Docenza (120 min)</option>
              <option value="work_meeting">💼 Meeting (360 min)</option>
            </optgroup>
            <optgroup label="FAMIGLIA 👨‍👩‍👧‍👦">
              <option value="famiglia_appuntamento">👨‍👩‍👧‍👦 Appuntamento (360 min)</option>
            </optgroup>
            <optgroup label="SALUTE 🧠">
              <option value="salute_psicologo">🧠 Psicologo (180 min)</option>
              <option value="salute_altro">🧠 Altro (180 min)</option>
            </optgroup>
          </select></div>
          <div class="form-group"><label>Data e Ora</label><input type="datetime-local" id="apt-datetime" required></div>
          <div class="form-group"><label>Durata (minuti)</label><input type="number" id="apt-duration" value="60" required></div>
          <button type="submit">Crea e Sincronizza</button>
        </form>
      </div>
      <div class="section">
        <h2>📋 Appuntamenti di Oggi</h2>
        <div id="appointments-list" class="list"></div>
      </div>
    </div>

    <div id="activities" class="content">
      <div class="section">
        <h2>➕ Nuova Attività</h2>
        <form onsubmit="createActivity(event)">
          <div class="form-group"><label>Titolo</label><input type="text" id="act-title" required></div>
          <div class="form-group"><label>Cliente</label><select id="act-client" required></select></div>
          <div class="form-group"><label>Categoria</label><select id="act-category" required onchange="updateActivityDuration()">
            <optgroup label="WORK 💼">
              <option value="work_amministrazione">💼 Amministrazione (10 min)</option>
              <option value="work_message_mail">💼 Message/Mail (10 min)</option>
            </optgroup>
            <optgroup label="GESTIONE 💳">
              <option value="gestione_pagamenti">💳 Pagamenti (15 min)</option>
            </optgroup>
            <optgroup label="FAMIGLIA 👨‍👩‍👧‍👦">
              <option value="famiglia_gestione">👨‍👩‍👧‍👦 Gestione (120 min)</option>
            </optgroup>
            <optgroup label="SVAGO 🎉">
              <option value="svago">🎉 Svago (60 min)</option>
            </optgroup>
            <optgroup label="VARIE ⚙️">
              <option value="varie">⚙️ Varie (60 min)</option>
            </optgroup>
          </select></div>
          <div class="form-group"><label>Data e Ora</label><input type="datetime-local" id="act-datetime" required></div>
          <div class="form-group"><label>Durata (minuti)</label><input type="number" id="act-duration" value="60" required></div>
          <button type="submit">Crea Attività</button>
        </form>
      </div>
      <div class="section">
        <h2>📋 Attività di Oggi</h2>
        <div id="activities-list" class="list"></div>
      </div>
    </div>

    <div id="clients" class="content">
      <div class="section">
        <h2>➕ Aggiungi Cliente</h2>
        <form onsubmit="createClient(event)">
          <div class="form-group"><label>Nome</label><input type="text" id="client-name" required></div>
          <div class="form-group"><label>Email</label><input type="email" id="client-email" required></div>
          <div class="form-group"><label>Telefono</label><input type="tel" id="client-phone"></div>
          <div class="form-group"><label>Note</label><textarea id="client-notes" rows="3"></textarea></div>
          <button type="submit">Aggiungi</button>
        </form>
      </div>
      <div class="section">
        <h2>👥 Lista Clienti</h2>
        <div id="clients-list" class="list"></div>
      </div>
    </div>

    <div id="invoices" class="content">
      <div class="section">
        <h2>➕ Fattura da Emettere</h2>
        <form onsubmit="createInvoice(event)">
          <div class="form-group"><label>Cliente</label><select id="invoice-client" required></select></div>
          <div class="form-group"><label>Importo €</label><input type="number" id="invoice-amount" step="0.01" required></div>
          <div class="form-group"><label>Tipo</label><select id="invoice-type" required><option value="netto">Netto</option><option value="lordo">Lordo</option></select></div>
          <div class="form-group"><label>Data Scadenza</label><input type="date" id="invoice-date" required></div>
          <button type="submit">Aggiungi</button>
        </form>
      </div>
      <div class="section">
        <h2>📋 Fatture</h2>
        <div id="invoices-list" class="list"></div>
      </div>
    </div>

    <div id="calendar" class="content">
      <iframe src="/calendar.html" style="width: 100%; height: 800px; border: none; border-radius: 12px;"></iframe>
    </div>
  </div>

  <div id="editAptModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Modifica Appuntamento</h2>
        <button class="modal-close" onclick="closeEditAptModal()">&times;</button>
      </div>
      <form onsubmit="saveAppointment(event)">
        <input type="hidden" id="edit-apt-id">
        <div class="form-group"><label>Titolo</label><input type="text" id="edit-apt-title" required></div>
        <div class="form-group"><label>Categoria</label><select id="edit-apt-category" required></select></div>
        <div class="form-group"><label>Data e Ora</label><input type="datetime-local" id="edit-apt-datetime" required></div>
        <div class="form-group"><label>Durata (minuti)</label><input type="number" id="edit-apt-duration" required></div>
        <button type="submit" style="width: 100%;">Salva</button>
      </form>
    </div>
  </div>

  <div id="editActModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Modifica Attività</h2>
        <button class="modal-close" onclick="closeEditActModal()">&times;</button>
      </div>
      <form onsubmit="saveActivity(event)">
        <input type="hidden" id="edit-act-id">
        <div class="form-group"><label>Titolo</label><input type="text" id="edit-act-title" required></div>
        <div class="form-group"><label>Categoria</label><select id="edit-act-category" required></select></div>
        <div class="form-group"><label>Data e Ora</label><input type="datetime-local" id="edit-act-datetime" required></div>
        <div class="form-group"><label>Durata (minuti)</label><input type="number" id="edit-act-duration" required></div>
        <button type="submit" style="width: 100%;">Salva</button>
      </form>
    </div>
  </div>

  <script>
    const categoryDurations = {
      work_consulenza_spot: 50, work_consulenza: 60, work_allineamento: 30, work_primo_app: 60,
      work_docenza: 120, work_amministrazione: 10, work_message_mail: 10, work_meeting: 360,
      gestione_pagamenti: 15, famiglia_gestione: 120, famiglia_appuntamento: 360,
      salute_psicologo: 180, salute_altro: 180, svago: 60, varie: 60
    };

    const appointmentCategories = ['work_consulenza_spot', 'work_consulenza', 'work_allineamento', 'work_primo_app', 'work_docenza', 'work_meeting', 'famiglia_appuntamento', 'salute_psicologo', 'salute_altro'];
    const activityCategories = ['work_amministrazione', 'work_message_mail', 'gestione_pagamenti', 'famiglia_gestione', 'svago', 'varie'];

    let allClients = [], appointments = [], activities = [];

    function updateDuration() {
      const cat = document.getElementById('apt-category').value;
      document.getElementById('apt-duration').value = categoryDurations[cat] || 60;
    }

    function updateActivityDuration() {
      const cat = document.getElementById('act-category').value;
      document.getElementById('act-duration').value = categoryDurations[cat] || 60;
    }

    function showTab(tab) {
      document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
      event.target.classList.add('active');

      if (tab === 'dashboard') loadDashboard();
      if (tab === 'appointments') { loadAppointments(); loadClients(); }
      if (tab === 'activities') { loadActivities(); loadClients(); }
      if (tab === 'clients') loadClients();
      if (tab === 'invoices') { loadInvoices(); loadClients(); }
    }

    async function loadClients() {
      const res = await fetch('/api/clients');
      allClients = await res.json();
      renderClientSelects();
      renderClients();
    }

    async function loadAppointments() {
      const res = await fetch('/api/appointments');
      const all = await res.json();
      appointments = all.filter(a => appointmentCategories.includes(a.category));
      renderAppointments();
    }

    async function loadActivities() {
      const res = await fetch('/api/appointments');
      const all = await res.json();
      activities = all.filter(a => activityCategories.includes(a.category));
      renderActivities();
    }

    async function loadInvoices() {
      const res = await fetch('/api/invoices');
      const invoices = await res.json();
      renderInvoices(invoices);
    }

    async function loadDashboard() {
      await loadAppointments();
      await loadClients();
      const upcoming = appointments.filter(a => new Date(a.start_time) > new Date()).slice(0, 5);
      document.getElementById('dashboard-appointments').innerHTML = upcoming.map(a =>
        `<div class="item"><div class="item-content"><h3>${a.title}</h3><span class="category-badge">${a.category}</span><p>📅 ${new Date(a.start_time).toLocaleString('it-IT')}</p></div></div>`
      ).join('') || '<p>Nessun appuntamento</p>';
    }

    function renderClientSelects() {
      const opts = allClients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      document.getElementById('apt-client').innerHTML = opts;
      document.getElementById('act-client').innerHTML = opts;
      document.getElementById('invoice-client').innerHTML = opts;
    }

    function renderClients() {
      document.getElementById('clients-list').innerHTML = allClients.map(c =>
        `<div class="item"><div class="item-content"><h3>${c.name}</h3><p>📧 ${c.email}</p></div><div class="item-actions"><button class="delete" onclick="deleteClient(${c.id})">🗑️</button></div></div>`
      ).join('');
    }

    function renderAppointments() {
      const today = new Date().toISOString().split('T')[0];
      const todayApts = appointments.filter(a => a.start_time.startsWith(today));
      document.getElementById('appointments-list').innerHTML = todayApts.map(a =>
        `<div class="item"><div class="item-content"><h3>${a.title}</h3><span class="category-badge">${a.category}</span><p>📅 ${new Date(a.start_time).toLocaleString('it-IT')}</p></div><div class="item-actions"><button class="edit" onclick="editAppointment(${a.id})">✏️</button><button class="delete" onclick="deleteAppointment(${a.id})">🗑️</button></div></div>`
      ).join('') || '<p>Nessun appuntamento</p>';
    }

    function renderActivities() {
      const today = new Date().toISOString().split('T')[0];
      const todayActs = activities.filter(a => a.start_time.startsWith(today));
      document.getElementById('activities-list').innerHTML = todayActs.map(a =>
        `<div class="item"><div class="item-content"><h3>${a.title}</h3><span class="category-badge">${a.category}</span><p>📅 ${new Date(a.start_time).toLocaleString('it-IT')}</p></div><div class="item-actions"><button class="edit" onclick="editActivity(${a.id})">✏️</button><button class="delete" onclick="deleteActivity(${a.id})">🗑️</button></div></div>`
      ).join('') || '<p>Nessuna attività</p>';
    }

    function renderInvoices(invoices) {
      document.getElementById('invoices-list').innerHTML = invoices.map(inv =>
        `<div class="item"><div class="item-content"><h3>💰 ${allClients.find(c => c.id === inv.client_id)?.name || 'Sconosciuto'}</h3><p>💵 €${inv.amount}</p><p>📆 ${new Date(inv.invoice_date).toLocaleDateString('it-IT')}</p></div></div>`
      ).join('');
    }

    async function createClient(e) {
      e.preventDefault();
      await fetch('/api/clients', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: 1,
          name: document.getElementById('client-name').value,
          email: document.getElementById('client-email').value,
          phone: document.getElementById('client-phone').value,
          notes: document.getElementById('client-notes').value
        })
      });
      e.target.reset();
      loadClients();
    }

    async function createAppointment(e) {
      e.preventDefault();
      const category = document.getElementById('apt-category').value;
      const res = await fetch('/api/appointments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: 1,
          client_id: parseInt(document.getElementById('apt-client').value),
          call_type_id: 1,
          title: document.getElementById('apt-title').value,
          start_time: document.getElementById('apt-datetime').value,
          duration_minutes: parseInt(document.getElementById('apt-duration').value),
          category: category
        })
      });
      if (res.ok) {
        const apt = await res.json();
        await fetch('/api/appointments/auto-sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ aptId: apt.id, userEmail: 'primary' })
        });
        e.target.reset();
        loadAppointments();
      }
    }

    async function createActivity(e) {
      e.preventDefault();
      await fetch('/api/appointments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: 1,
          client_id: parseInt(document.getElementById('act-client').value),
          call_type_id: 1,
          title: document.getElementById('act-title').value,
          start_time: document.getElementById('act-datetime').value,
          duration_minutes: parseInt(document.getElementById('act-duration').value),
          category: document.getElementById('act-category').value
        })
      });
      e.target.reset();
      loadActivities();
    }

    async function createInvoice(e) {
      e.preventDefault();
      await fetch('/api/invoices', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: 1,
          client_id: parseInt(document.getElementById('invoice-client').value),
          amount: parseFloat(document.getElementById('invoice-amount').value),
          invoice_date: document.getElementById('invoice-date').value,
          status: 'pending',
          notes: document.getElementById('invoice-type').value
        })
      });
      e.target.reset();
      loadInvoices();
    }

    function editAppointment(id) {
      const apt = appointments.find(x => x.id === id);
      document.getElementById('edit-apt-id').value = id;
      document.getElementById('edit-apt-title').value = apt.title;
      const opts = appointmentCategories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
      document.getElementById('edit-apt-category').innerHTML = opts;
      document.getElementById('edit-apt-category').value = apt.category;
      const dtStr = apt.start_time.replace("Z", "").split(".")[0].substring(0, 16);
      document.getElementById("edit-apt-datetime").value = dtStr;
      document.getElementById('edit-apt-duration').value = apt.duration_minutes;
      document.getElementById('editAptModal').classList.add('active');
    }

    function editActivity(id) {
      const act = activities.find(x => x.id === id);
      document.getElementById('edit-act-id').value = id;
      document.getElementById('edit-act-title').value = act.title;
      const opts = activityCategories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
      document.getElementById('edit-act-category').innerHTML = opts;
      document.getElementById('edit-act-category').value = act.category;
      const dtStr = act.start_time.replace("Z", "").split(".")[0].substring(0, 16);
      document.getElementById("edit-act-datetime").value = dtStr;
      document.getElementById('edit-act-duration').value = act.duration_minutes;
      document.getElementById('editActModal').classList.add('active');
    }

    function closeEditAptModal() { document.getElementById('editAptModal').classList.remove('active'); }
    function closeEditActModal() { document.getElementById('editActModal').classList.remove('active'); }

    async function saveAppointment(e) {
      e.preventDefault();
      const id = document.getElementById('edit-apt-id').value;
      await fetch(`/api/appointments/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: document.getElementById('edit-apt-title').value,
          start_time: document.getElementById('edit-apt-datetime').value,
          duration_minutes: parseInt(document.getElementById('edit-apt-duration').value),
          category: document.getElementById('edit-apt-category').value
        })
      });
      closeEditAptModal();
      loadAppointments();
    }

    async function saveActivity(e) {
      e.preventDefault();
      const id = document.getElementById('edit-act-id').value;
      await fetch(`/api/appointments/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: document.getElementById('edit-act-title').value,
          start_time: document.getElementById('edit-act-datetime').value,
          duration_minutes: parseInt(document.getElementById('edit-act-duration').value),
          category: document.getElementById('edit-act-category').value
        })
      });
      closeEditActModal();
      loadActivities();
    }

    async function deleteClient(id) {
      if (!confirm('Elimina?')) return;
      await fetch(`/api/clients/${id}`, { method: 'DELETE' });
      loadClients();
    }

    async function deleteAppointment(id) {
      if (!confirm('Elimina?')) return;
      const apt = appointments.find(x => x.id === id);
      if (apt?.google_event_id) {
        await fetch(`/api/appointments/${id}/delete-from-google`, {
          method: 'POST',
          body: JSON.stringify({ userEmail: 'primary' }),
          headers: { 'Content-Type': 'application/json' }
        });
      }
      await fetch(`/api/appointments/${id}`, { method: 'DELETE' });
      loadAppointments();
    }

    async function deleteActivity(id) {
      if (!confirm('Elimina?')) return;
      await fetch(`/api/appointments/${id}`, { method: 'DELETE' });
      loadActivities();
    }

    async function readFromGoogle() {
      if (!confirm('Leggi da Google?')) return;
      const res = await fetch('/api/sync/read-google', { method: 'POST' });
      if (res.ok) alert('✅ Importato!');
      loadAppointments();
    }

    loadDashboard();
  </script>
</body>
</html>
